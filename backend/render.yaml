services:
  - type: web
    name: meetscribe-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build --workspace=backend
    startCommand: npm start --workspace=backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: meetscribe-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-oss-20b:free
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: meetscribe-db
    plan: free
    region: oregon
